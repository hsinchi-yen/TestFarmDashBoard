<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNexion SoM - Settings</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
  <header class="toolbar">
    <a href="/" class="toolbar__back">← Back to Dashboard</a>
    <h1>TechNexion SoM - Settings</h1>
    <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌓</button>
  </header>

  <main class="config-page">
    <!-- Jenkins Connection Section -->
    <section class="config-section">
      <h2>Jenkins Connection Settings</h2>
      <form id="jenkins-form">
        <div class="form-group">
          <label>Jenkins URL</label>
          <input type="url" id="jenkins-url" placeholder="http://10.88.95.1:8080" required>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="jenkins-user" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="jenkins-pass" placeholder="Password is set; leave blank to keep it">
        </div>
        <div class="form-actions">
          <button type="button" id="test-btn" class="btn btn--secondary">Test Connection</button>
          <button type="submit" class="btn btn--primary">Save Settings</button>
        </div>
        <div id="connection-status" class="connection-status"></div>
      </form>
    </section>

    <!-- Job Browser Section -->
    <section class="config-section">
      <h2>Add Monitored Job</h2>
      <p class="section-desc">Load Jenkins jobs and select one to monitor on the dashboard.</p>
      <div class="job-browser">
        <div class="job-add-row">
          <select id="job-select" class="job-select" disabled>
            <option value="">-- Load jobs first --</option>
          </select>
          <button id="add-job-btn" class="btn btn--primary" disabled>＋ Add</button>
        </div>
        <div class="job-actions-row">
          <button id="refresh-jobs" class="btn btn--secondary">🔄 Reload Jobs</button>
          <span id="job-status" class="job-status"></span>
        </div>
      </div>
    </section>

    <!-- Card Management Section -->
    <section class="config-section">
      <h2>Monitored Jobs <span id="card-count" class="badge">0</span></h2>
      <div id="card-manager" class="card-manager">
        <!-- Sortable card items -->
      </div>
    </section>
  </main>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal" style="display:none">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <h3>Confirm Removal</h3>
      <p>Are you sure you want to remove <strong id="delete-job-name"></strong>?</p>
      <div class="modal__actions">
        <button class="btn btn--secondary" id="cancel-delete">Cancel</button>
        <button class="btn btn--danger" id="confirm-delete">Remove</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="/js/config.js"></script>
</body>
</html>
