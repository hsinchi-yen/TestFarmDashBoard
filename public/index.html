<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNexion SoM - Board , Test Farm</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Loaded non-blocking: on an isolated lab network Google Fonts is unreachable
       and a plain stylesheet link would stall first paint until it times out. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
  <!-- Toolbar -->
  <header class="toolbar">
    <div class="toolbar__left">
      <h1 class="toolbar__title">TechNexion SoM - Board , Test Farm</h1>
    </div>
    <div class="toolbar__center">
      <div class="grid-switcher">
        <button data-grid="3x3" class="grid-btn">3×3</button>
        <button data-grid="4x4" class="grid-btn active">4×4</button>
        <button data-grid="5x5" class="grid-btn">5×5</button>
      </div>
      <div class="page-indicator">
        <span class="page-current">1</span> / <span class="page-total">1</span>
      </div>
      <span id="latest-chip" class="latest-chip" style="display:none"></span>
    </div>
    <div class="toolbar__right">
      <span id="current-date" class="current-date"></span>
      <button id="theme-toggle" class="icon-btn" title="切換主題">🌓</button>
      <a href="/config.html" class="icon-btn" title="設定">⚙️</a>
      <span class="last-updated"></span>
    </div>
  </header>

  <!-- Dashboard Grid -->
  <main class="dashboard">
    <div id="card-grid" class="card-grid grid-4x4">
      <!-- Cards dynamically inserted -->
    </div>
  </main>

  <script src="/js/grid-preference.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
